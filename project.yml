name: MducXiosApp
options:
  bundleIdPrefix: com.mducxios
  deploymentTarget:
    iOS: "14.0"
targets:
  MducXiosApp:
    type: application
    platform: iOS
    sources:
      - AppDelegate.swift
      - MainViewController.swift
      - LicenseManager.swift
    resources:
      - bg_image.jpg.WEBP
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mducxios.launcher
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
